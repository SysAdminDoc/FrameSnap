name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check framesnap.py test_framesnap.py
      - name: Test
        run: python -m pytest -q --basetemp "${{ runner.temp }}/framesnap-pytest"

  package:
    name: Windows package smoke test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and build tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
      - name: Build Windows executable
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Smoke-test executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist/FrameSnap.exe)) {
            throw "PyInstaller did not produce dist/FrameSnap.exe"
          }
          & ./dist/FrameSnap.exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "FrameSnap.exe --version failed with code $LASTEXITCODE"
          }

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and auditor
        run: python -m pip install --upgrade pip && python -m pip install -e . pip-audit
      - name: Audit installed dependencies
        run: pip-audit --progress-spinner off .

  windows-lock:
    name: Verify Windows runtime lock
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve hash-locked runtime
        run: >-
          python -m pip install --dry-run --ignore-installed --require-hashes
          --only-binary=:all: -r packaging/requirements-win-py312.txt
