app-id: com.sysadmindoc.FrameSnap
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: framesnap
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
modules:
  - name: framesnap
    buildsystem: simple
    build-commands:
      - install -Dm755 framesnap-launcher /app/bin/framesnap
      - install -Dm644 framesnap.py /app/share/framesnap/framesnap.py
      - install -Dm644 framesnap_version.py /app/share/framesnap/framesnap_version.py
      - install -Dm644 framesnap_plugins.py /app/share/framesnap/framesnap_plugins.py
      - install -Dm644 framesnap_es.qm /app/share/framesnap/translations/framesnap_es.qm
      - install -Dm644 com.sysadmindoc.FrameSnap.512.png /app/share/icons/hicolor/512x512/apps/com.sysadmindoc.FrameSnap.png
      - install -Dm644 com.sysadmindoc.FrameSnap.desktop /app/share/applications/com.sysadmindoc.FrameSnap.desktop
      - install -Dm644 com.sysadmindoc.FrameSnap.metainfo.xml /app/share/metainfo/com.sysadmindoc.FrameSnap.metainfo.xml
      - "python3 -m pip install --no-index --find-links=. --no-cache-dir --no-compile --only-binary=:all: --prefix=/app PyQt6 opencv-python-headless numpy Pillow av"
    sources:
      - type: file
        path: ../framesnap.py
      - type: file
        path: ../framesnap_version.py
      - type: file
        path: ../framesnap_plugins.py
      - type: file
        path: ../translations/framesnap_es.qm
